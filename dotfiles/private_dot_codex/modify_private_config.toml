{{- /* chezmoi:modify-template */ -}}
{{- $root := .chezmoi.workingTree -}}
{{- $current := dict -}}
{{- if trim .chezmoi.stdin -}}{{- $current = fromToml .chezmoi.stdin -}}{{- end -}}
{{- range $key, $value := (include (joinPath $root "config/codex.json") | fromJson) -}}
{{- $current = setValueAtPath (list $key) $value $current -}}
{{- end -}}
{{- $plugins := include (joinPath $root "plugins/manifest.json") | fromJson -}}
{{- range $plugin := $plugins.codex -}}
{{- $current = setValueAtPath (list "plugins" $plugin "enabled") true $current -}}
{{- end -}}
{{- $mcp := include (joinPath $root "shared/mcp.json") | fromJson -}}
{{- range $name, $server := $mcp.servers -}}
{{- if hasKey $server "codex" -}}
{{- $current = setValueAtPath (list "mcp_servers" $name) $server.codex $current -}}
{{- end -}}
{{- end -}}
{{ $current | toToml }}
