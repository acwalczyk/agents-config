# Profile selection metadata. Routing overlays live in profiles/claude/*.json.
# Existing native settings and shell exports are retained during staged testing.

[claude]
selection = "explicit per-task profiles"
shared_native_config = "~/.claude"

[claude.profiles.vertex]
settings = "profiles/claude/vertex.json"
launcher = "bin/claude-vertex"
authentication = "existing Google Application Default Credentials"

[claude.profiles.enmaas]
settings = "profiles/claude/enmaas.json"
launcher = "bin/claude-enmaas"
authentication = "existing native Claude ANTHROPIC_API_KEY; never copied to Git"

[codex]
authentication = "native API key authentication"
credential_location = "~/.codex/auth.json"
model = "gpt-6.1-sol"

[opencode_legacy]
endpoint = "http://localhost:4000/v1"
status = "inactive in daily workflow; retain until separately retired"
